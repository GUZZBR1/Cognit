<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ação protegida | Cognit</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 38rem; padding: 0 1rem; }
      button { cursor: pointer; margin: .4rem .4rem .4rem 0; padding: .6rem 1rem; }
      #protected-action { background: #eef6ff; border: 1px solid #7798bb; padding: 1rem; }
      #protected-action[hidden] { display: none; }
      #status { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ação protegida</h1>
      <p>Confirme o desafio. O servidor só libera a ação depois de validar a resposta e consumir um token de uso único.</p>
      <section aria-labelledby="challenge-heading">
        <h2 id="challenge-heading">Desafio</h2>
        <p id="question">Carregando…</p>
        <div id="choices"></div>
        <button id="new-challenge" type="button">Novo desafio</button>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="protected-action" hidden>
        <h2>Conteúdo protegido</h2>
        <p id="protected-result"></p>
      </section>
    </main>
    <script type="module" src="/src/protected-action-demo.js"></script>
  </body>
</html>
