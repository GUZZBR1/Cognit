<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cognit visual agent demo</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #172554; font: 18px system-ui, sans-serif; }
      main { width: min(640px, calc(100% - 48px)); padding: 28px; border-radius: 20px; background: white; box-shadow: 0 12px 36px #17255418; }
      h1 { margin-top: 0; font-size: 25px; }
      .choices { display: flex; gap: 18px; margin: 28px 0; }
      button { width: 130px; height: 120px; border: 2px solid #cbd5e1; border-radius: 14px; background: #f8fafc; cursor: pointer; }
      button:hover, button:focus-visible { border-color: #2563eb; outline: 3px solid #bfdbfe; }
      .shape { display: block; width: 44px; height: 44px; margin: auto auto 10px; }
      .circle { border-radius: 50%; background: #2563eb; }
      .square { background: #16a34a; }
      .triangle { width: 0; height: 0; border-right: 25px solid transparent; border-bottom: 44px solid #f97316; border-left: 25px solid transparent; }
      #result { min-height: 28px; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <h1>Select the green square</h1>
      <p>Choose one shape to continue.</p>
      <section class="choices" aria-label="Shapes">
        <button data-choice="circle"><span class="shape circle"></span>Circle</button>
        <button data-choice="square"><span class="shape square"></span>Square</button>
        <button data-choice="triangle"><span class="shape triangle"></span>Triangle</button>
      </section>
      <div id="result" role="status" aria-live="polite">Waiting for a selection.</div>
    </main>
    <script type="module" src="/examples/browser/visual-agent-demo.js"></script>
  </body>
</html>
