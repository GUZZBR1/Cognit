<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A short perception challenge with visual and accessible text presentations.">
    <title>Cognit — Visual challenge</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">COGNIT · PERCEPTION LAB</p>
        <h1>Perception challenge</h1>
        <p>Choose a challenge presentation, then tell us what you noticed.</p>
      </header>

      <section class="panel" aria-labelledby="setup-title">
        <h2 id="setup-title">Set up your challenge</h2>
        <label for="challenge">Challenge</label>
        <select id="challenge"></select>
        <label for="presentation">Challenge presentation</label>
        <select id="presentation" aria-describedby="presentation-help">
          <option value="visual">Visual, timed pattern</option>
          <option value="text">Accessible text pattern (untimed)</option>
        </select>
        <p id="presentation-help">Both presentations use the same challenge and answer.</p>
        <div id="duration-setting">
          <label for="duration">Pattern display time</label>
          <select id="duration">
            <option value="50">50 milliseconds</option>
            <option value="100" selected>100 milliseconds</option>
            <option value="200">200 milliseconds</option>
            <option value="500">500 milliseconds</option>
          </select>
        </div>
        <button id="start">Start challenge</button>
      </section>

      <section id="challenge-area" class="panel" aria-live="polite" hidden>
        <h2 id="prompt-title" tabindex="-1">Look at the pattern</h2>
        <p id="instruction"></p>
        <div id="stimulus" class="stimulus" role="img"></div>
        <ol id="accessible-stimulus" class="accessible-stimulus" aria-label="Pattern sequence in reading order" hidden></ol>
        <form id="answer-form" hidden>
          <label id="answer-label" for="answer"></label>
          <div class="answer-row">
            <input id="answer" name="answer" autocomplete="off" required>
            <button type="submit">Submit answer</button>
          </div>
        </form>
        <p id="status" class="status" role="status"></p>
      </section>

      <section id="result-area" class="panel" aria-labelledby="result-title" hidden>
        <h2 id="result-title">Your result</h2>
        <p id="result-summary"></p>
        <pre><code id="result-json"></code></pre>
        <button id="download" type="button">Download JSON</button>
      </section>
    </main>
  </body>
</html>
